name: Build & Test

# R-06: тест-гейт на каждый пуш/PR; дорогие EAS-сборки — только по кнопке
# (workflow_dispatch) или тегу v*. Раньше билдились на каждый пуш в main —
# сжигали EAS-минуты и краснели без Apple-аккаунта (F-08).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Type Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Encoding check (UTF-8, no mojibake/BOM)
        run: node scripts/check-encoding.js

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci --coverage=false --passWithNoTests=false

  build-android:
    name: Build Android (EAS preview)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android (preview)
        run: eas build --platform android --profile preview --non-interactive

  build-ios:
    name: Build iOS (EAS preview)
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS (preview)
        run: eas build --platform ios --profile preview --non-interactive
