# Maestro E2E — питч-сценарий «3 клика» (R-15, F-20).
# Запуск (нужен эмулятор/устройство с установленным приложением):
#   maestro test .maestro/pitch-flow.yaml
# Установка maestro: https://maestro.mobile.dev
#
# Проверяет главный investor-flow: онбординг -> вкладка Добавить ->
# детали -> публикация. Пока ручной smoke: без эмулятора в CI не гоняем
# (задача в BUG-06: подключить к GitHub Actions после MVP).

appId: com.danilchil.autograph
---
- launchApp
- extendedWaitUntil:
    visible: 'Коллекция'
    timeout: 15000
# Гость видит ленту (демо-режим или пустое состояние)
- assertVisible: '.*Коллекция.*'
# Навигация: Добавить (центральная кнопка)
- tapOn: 'Добавить'
- assertVisible: '.*Фото.*'
# Назад в ленту — свайпом не проверяем (платформозависимо), через таб-бар
- tapOn: 'Коллекция'
# Профиль
- tapOn: 'Профиль'
- assertVisible: '.*очков доверия.*'
# Ещё -> секции
- tapOn: 'Ещё'
- assertVisible: 'Сообщество'
- back
